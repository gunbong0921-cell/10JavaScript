<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J19Event04.html</title>
  <style>
    #myBox{
      background-color: aquamarine;
      padding: 10px; text-align: center; width: 250px; height: 50px; line-height: 25px;
    }
  </style>
  <script>
    //전역변수 선언
    let globalNum = 0;
    let mBox ;
    window.onload = function() {
      //문서의 로드가 끝난 직후 div태그의 DOm 얻어옴 
      mBox = document.getElementById('myBox');
      /*
      DOM요소에 이벤트리스너를 붙인 후 함수를 연결한다. 이때 소괄호는 제거하고 함수명은 기술해야한다.
      */
     //마우스 왼쪽 버튼 틀릭 이벤트 
      mBox.onclick = clickFunc;
      //mBox.onclick = clickFunc(); //연결안됨
      //마우스 오른쪽 버튼 클릭 이벤트 
      mBox.addEventListener('contextmenu', rclickFunc);
    }
    //마우스 좌클릭시 실행할 함수 정의
    function clickFunc() {
      //전역변수로 정의한 숫자 증가
      mBox.innerHTML = globalNum++;
      //글자색과 크기 변경 
      mBox.style.Color = 'red';
      mBox.style.fontSize = '1.8em';
    }
    //마우스 우클릭시 실행할 함수 정의 
    function rclickFunc() {
      /*
      우클릭시 나오는 컨텍스트 메뉴(팝업메뉴)를 차단한다. 즉 이벤트가 발생할때의 '기본동작'을 
      차단하는 역할을 한다.  
      */
      event.preventDefault();
      //전역변수로 정의한 숫자 감소 
      mBox.innerText = globalNum--;
      mBox.style.Color = 'blue';
      mBox.style.fontSize = '1.2em';
    }
  </script>
</head>
<body>
  <h2>이벤트 - load 네번째</h2>
  <div id="myBox" style="cursor: pointer;">
    좌클릭하면 숫자가 증가<br>
    우클릭하면 숫자가 감소
  </div>
</body>
</html>
