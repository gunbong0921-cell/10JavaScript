<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J29fetch02.html</title>
</head>
<body>
  <h2>fetch() - post 방식</h2>
  <script>
    const requestData = async () => {
      fetch('https://jsonplaceholder.typicode.com/posts', {
        method: 'POST',
        body: JSON.stringify({
          title: 'React',
          body: '최고의 프론트엔드 라이브러리',
          userId: 1,
        }),
        headers: {
          'Content-type': 'application/json; charset=UTF-8',
        },
      })
      .then((response) => response.json())
      .then((data) => {
        console.log(data);
        document.getElementById('callBackMsg').innerText = JSON.stringify(data);
      })
      .catch((error) => {
        console.error('fetch 통신 에러:', error);
      });
    }
  </script>
  <div id="callBackMsg"></div>
  <div>
    <button onclick="requestData()">요청하기</button>
  </div>
</body>
</html>
