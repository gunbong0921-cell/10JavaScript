  <script>
    var setCookie = function(name, value, exp){
      var date = new Date();
      date.setTime(date.getTime() + (exp*24*60*60*1000));
      // file:// 로 열면 path=/ 때문에 쿠키가 저장되지 않을 수 있음
      var cookie = name + "=" + value + "; expires=" + date.toUTCString();
      if(location.protocol !== "file:"){
        cookie += "; path=/";
      }
      document.cookie = cookie;
    };
    var getCookie = function(name){
      var values = document.cookie.split("; ");
      for(var i = 0; i < values.length; i++){
        var unit = values[i].trim();
        var value = unit.split("=");
        if(value[0] == name){
          return unescape(value[1]);
        }
      }
      return null;
    };
    function makeCookie(){
      var cName = document.getElementById("cName").value;
      var cValue = document.getElementById("cValue").value;

      setCookie(cName, cValue, 1);
      alert("쿠키가 생성되었습니다.");
      location.reload();
    }

    function readCookie(){
      var cName = document.getElementById("cName").value;

      var readValue = getCookie(cName);
      if(readValue == null){
        alert("쿠키가 존재하지 않습니다.");
      }
      else{
        alert("쿠키값: " + readValue);
      }
    }

    function deleteCookie(){
      var cName = document.getElementById("cName").value;

      setCookie(cName, cValue, -1);
      alert("쿠키가 삭제되었습니다.");
      location.reload();
    }

    function closeWin(){
      setCookie("popupClose", "Y", 1);
      document.getElementById("popupWin").style.display = "none";
    }
  
    window.onload = function(){
      var popupWin = document.getElementById("popupWin");
      if(getCookie("popupClose") != null){
        popupWin.style.display = "none";
      } else {
        popupWin.style.display = "block";
      }
    };
