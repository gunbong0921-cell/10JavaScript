<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    </head>
<body>
    <h2>변수와 타입</h2>
    <script> 
    var num;
    console.error("변수 초기화 전")
    console.log("자료형:", typeof(num), "데이터:", num); 
     
    console.error("변수 초기화 후")
    num = 100;
    console.log("자료형:", typeof(num), "데이터:", num); 
    
    num = '문자열';
    console.log("자료형:", typeof(num), "데이터:", num); 
    
    num = true;
    console.log("자료형:", typeof(num), "데이터:", num); 
     
    var num1=10, num2, str1="자바스크립트", str2;
 
    var result = num1 + num2;
   
    if(isNaN(result)){
        console.log("NaN이다. 즉 숫자가 아니다");  
    }
    else{
        console.log("NaN이 아니다. 즉 숫자이다");
    }    
     
    console.log("str1+str2="+ (str1+str2));   
    console.log("num1+str1="+ (num1+str1));  
     
    console.error("기타자료형");
    var date = new Date();
    console.log("자료형:", typeof(date), ", 데이터:", date);
    </script>
</body>
</html>
