<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J13String3.html</title>
</head>
<body>
  <h2>JS의 Core객체 - String</h2>
  <script>
    /*
        퀴즈] 아래 이메일 주소에서 @와 .사이에 있는값만
        추출하여 출력하는 프로그램을 작성하시오.
        xxx@yyy.co.kr 이라면 yyy만 출력되어야 한다.
    */
   var emailArray = ["kim@naver.com", "sung@hanmail.net", "park@kosmo.co.kr"];
   console.log("<h2>연습문제>도메인 추출하기</h2>");
   //익명함수로 정의함
   var getDomainStr = function(emailArr) {
    //방법1 : indexOf()를 사용하는 방법
    console.log("방법1 : indexOf()");
    for(var i = 0; i < emailArr.length; i++) {
      var email = emailArr[i];
      var atIdx = email.indexOf("@");
      var dotIdx = email.indexOf(".");
      var domain = email.substring(atIdx + 1, dotIdx);
      console.log(email + " => " + domain + "<br/>");
    }

    //방법2 : split()을 사용하는 방법
    console.log("방법2 : split()");
    for(var i = 0; i < emailArr.length; i++) {
      var email = emailArr[i];
      var domain = email.split("@")[1].split(".")[0];
      console.log(email + " => " + domain + "<br/>");
    }
   }

   getDomainStr(emailArray);
  </script>
</body>
</html>
