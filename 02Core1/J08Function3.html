<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J08Function3.html</title>
</head>
<body>
  <h2>ES6에서 등장한 let</h2> 
  <script>
    function myFunc1(){
      let num1 = 1;
    }

    function myFunc2(){
      console.log('myFunc2() 메소드안의 num1'+ num1);
    }

    myFunc1();
    //console.log("전역지역 num1="+ num1);
    //myFunc2();

    for(let i=0 ; i<=10 ; i++){
      console.log('for루프안 i='+ i);
    }
    console.log('for 루프밖 i='+ i);
  </script>
</body>
</html>
