<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J08Function2.html</title>
</head>
<body>
  <h2>ES6 이전의 문제점</h2>
  <script>
    function myFunc1(){
      var num1 = 1;
    }

    function myFunc2(){
      num2 = 2;
    }

    function myFunc3(){
      console.log('myFunc3()메소드안의 num2='+ num2);
    }

    myFunc1();
    //console.log("전역지역 num1="+ num1);

    myFunc2();
    console.log('전역지역 num2='+ num2);
    myFunc3();
    for(var i=0 ; i<=10 ; i++){
      console.log('for루프안 i='+ i);
    }
    console.log('for루프밖 i='+ i);
  </script>
</body>
</html>
