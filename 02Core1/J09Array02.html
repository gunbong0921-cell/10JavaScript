<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J09Array02.html</title>
</head>
<script>
  let studentArray = new Array();

  let getAverage = function(){
    let countOfStudent = document.getElementById('numOfStudents').value;
    let total = 0;
    for(let i=0; i<countOfStudent; i++){
      studentArray[i] = parseInt(prompt(i+1 +"번째 학생점수", "77"));
      total += studentArray[i];
    }
    let average = total / countOfStudent;
    let stringResult = "";
    for(let i=0; i<countOfStudent; i++){
      stringResult += (i+1) + "번째학생의점수: " + studentArray[i] + "\r\n";
    }
  }
</script>
<body>
  <h2>배열을 이용한 평균구하기</h2>
  <!-- table>tr*2>td*2 -->
   <table border="1">
    <tr>
      <td>
        학생수입력:
      </td>
      <td>
        <input type="number" id="numOfStudents" size="5" value="1">
      </td>
    </tr>
    <tr>
      <td colspan="2">
        <button type="button" onclick="getAverage()">평균구하기</button>
      </td>
    </tr>
   </table>
</body>
</html>
