  <h2>배열</h2>
  <script>
    function printArr(arr){
      for(var i=0 ; i<arr.lenght ; i++){
        console.log('자료형:'+ typeof(arr[i]) +", ["+i+"]:"+ arr[i]);
      }
    }

    console.error("배열1")
    var array = new Array(5);
    array[0] = 100;
    array[1] = '자바스크립트';
    array[2] = new Date();
    array[3] = 3.14;
    array[4] = false;
    printArr(array);

    console.log('배열2');
    
  </script>
