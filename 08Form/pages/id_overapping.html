<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>id_overapping.html</title>
  <script type="text/javascript">
    /*
    부모창에서 팝업창을 열때 reafOnly 속성을 부여하므로 사용자는 아이디를 수정할 수 없다. 하지만
    JavaScript의 opener 객체를 통해 부모창의 DOM요소에 접근할 수 있으므로 입력값을 수정할 수 있다. 
    */
    function idUse() {
      //자식창에서 재입력한 아이디를 부모창의 입력상자에 입력
      var retypeId = document.OverlapFrm.retype_id.value;
      if (retypeId == "") {
        alert("사용할 아이디를 입력하세요.");
        document.OverlapFrm.retype_id.focus();
        return;
      }
      //부모창의 입력상자에 재입력한 아이디를 입력 
      opener.document.registFrm.id.value = retypeId;
      //팝업창을 닫는다. 
      self.close();
    }
    //현재 페이지가 로드되면 실행되는 이벤트 핸들러 
    window.onload = function(){
	    //현재 주소창에 입력된 URL을 가져온다. 
	    var url = location.href;
	    //물음표(?) 및 엠퍼센트(&)를 통해 문자열을 배열로 만든다. 
	    var parameters = (url.slice(url.indexOf('?') + 1, url.length)).split('&');
	    //이퀄(=)을 통해 split한다. 
	    var returnValue = decodeURIComponent(parameters[0].split('=')[1]);
	    //span태그에 삽입한다. 
	    document.getElementById('user_id').innerHTML = returnValue;
    }
  </script>
</head>
<body>
  <h2>아이디 중복확인 하기</h2>

  <!-- 현재 페이지에서는 JSP를 사용하지 않으므로 주석처리한다. 
  <h4>JSP에서 전달받은 아이디 : <%=request.getParameter("id") %></h4>
  -->
  <!-- 파라미터로 전달된 아이디를 확인하기 위해 span태그를 사용해 입력한다. -->
  <h3>부모창에 입력한 아이디 : <span id="user_id"></span></h3>

  <h3>아이디가 중복되었을때 재입력한 아이디</h3>
  <form name="OverlapFrm">
    <input type="text" name="retype_id" size="20" />
    <input type="button" value="아이디사용하기" onclick="idUse();" />
  </form>
</body>
</html>
